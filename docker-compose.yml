services:
  beherit:
    build:
      context: .
      dockerfile: Dockerfile
    image: beherit:latest
    container_name: beherit-app
    restart: unless-stopped
    ports:
      - "${BEHERIT_PORT:-8650}:8650"
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - BEHERIT_HOST=0.0.0.0
      - BEHERIT_PORT=8650
      - BEHERIT_DATA_DIR=/app/data
      - BEHERIT_DB_PATH=/app/data/beherit.db
      - BEHERIT_ACCESS_TOKEN=${BEHERIT_ACCESS_TOKEN:-}
      - BEHERIT_SECRET_KEY=${BEHERIT_SECRET_KEY:-}
      - PLANE_API_URL=${PLANE_API_URL:-http://192.168.1.60:80/api/v1}
      - PLANE_API_KEY=${PLANE_API_KEY:-}
      - PLANE_WORKSPACE_SLUG=${PLANE_WORKSPACE_SLUG:-arch}
      - PLANE_PROJECT_ID=${PLANE_PROJECT_ID:-e428cd83-e3a2-49b3-bfe6-a1c26c4c0993}
    volumes:
      - ./data:/app/data
      - ~/.claude:/root/.claude:ro
      - ~/.local/bin/agy:/usr/local/bin/agy:ro
      - ~/.gemini:/root/.gemini
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8650/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
